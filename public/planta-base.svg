<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <style>
      .wall { stroke: #e8e8ea; stroke-width: 6; stroke-linejoin: round; }
      .thin { stroke: #9aa0a6; stroke-width: 2; }
      .door { stroke: #9aa0a6; stroke-width: 2; fill: none; }
      .lbl { fill: #c7ccd1; font-family: 'Montserrat', sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
      .dim { fill: #6b7075; font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 600; }
    </style>
  </defs>

  <!-- Perímetro externo -->
  <rect x="60" y="60" width="680" height="480" class="wall" />

  <!-- Divisórias internas -->
  <!-- coluna vertical central -->
  <line x1="400" y1="60" x2="400" y2="300" class="wall" />
  <line x1="400" y1="380" x2="400" y2="540" class="wall" />
  <!-- horizontais -->
  <line x1="60" y1="300" x2="240" y2="300" class="wall" />
  <line x1="240" y1="300" x2="240" y2="540" class="wall" />
  <line x1="400" y1="300" x2="560" y2="300" class="wall" />
  <line x1="560" y1="180" x2="740" y2="180" class="wall" />
  <line x1="560" y1="180" x2="560" y2="300" class="wall" />

  <!-- Aberturas de porta (vãos) -->
  <line x1="300" y1="300" x2="360" y2="300" stroke="#0a0b0d" stroke-width="8" />
  <line x1="400" y1="330" x2="400" y2="360" stroke="#0a0b0d" stroke-width="8" />
  <line x1="240" y1="410" x2="240" y2="450" stroke="#0a0b0d" stroke-width="8" />
  <line x1="560" y1="220" x2="560" y2="260" stroke="#0a0b0d" stroke-width="8" />

  <!-- Arcos de porta -->
  <path d="M300 300 A60 60 0 0 1 360 360" class="door" />
  <path d="M400 360 A30 30 0 0 0 430 330" class="door" />
  <path d="M240 450 A40 40 0 0 0 280 410" class="door" />

  <!-- Janelas -->
  <line x1="140" y1="60" x2="260" y2="60" class="thin" />
  <line x1="140" y1="66" x2="260" y2="66" class="thin" />
  <line x1="540" y1="60" x2="660" y2="60" class="thin" />
  <line x1="540" y1="66" x2="660" y2="66" class="thin" />
  <line x1="60" y1="380" x2="60" y2="480" class="thin" />
  <line x1="66" y1="380" x2="66" y2="480" class="thin" />

  <!-- Rótulos dos cômodos -->
  <text x="230" y="185" class="lbl" text-anchor="middle">Sala de Estar</text>
  <text x="230" y="205" class="dim" text-anchor="middle">24,5 m²</text>

  <text x="575" y="130" class="lbl" text-anchor="middle">Cozinha</text>
  <text x="575" y="150" class="dim" text-anchor="middle">12,0 m²</text>

  <text x="650" y="270" class="lbl" text-anchor="middle">Área</text>
  <text x="650" y="290" class="lbl" text-anchor="middle">Serviço</text>

  <text x="150" y="425" class="lbl" text-anchor="middle">Suíte</text>
  <text x="150" y="445" class="dim" text-anchor="middle">16,2 m²</text>

  <text x="320" y="425" class="lbl" text-anchor="middle">Banho</text>

  <text x="575" y="425" class="lbl" text-anchor="middle">Quarto</text>
  <text x="575" y="445" class="dim" text-anchor="middle">13,8 m²</text>

  <!-- Cotas gerais -->
  <text x="400" y="580" class="dim" text-anchor="middle">12,00 m</text>
  <text x="30" y="305" class="dim" text-anchor="middle" transform="rotate(-90 30 305)">8,00 m</text>
</svg>
