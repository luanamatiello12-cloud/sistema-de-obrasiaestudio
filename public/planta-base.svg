<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <style>
      .wall { stroke: #e8e8ea; stroke-width: 6; stroke-linejoin: round; }
      .thin { stroke: #9aa0a6; stroke-width: 2; }
      .door { stroke: #9aa0a6; stroke-width: 2; fill: none; }
      .col  { fill: #e8e8ea; }
      .lbl  { fill: #c7ccd1; font-family: 'Montserrat', sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
      .dim  { fill: #6b7075; font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 600; }
    </style>
  </defs>

  <!-- Varanda (frente) -->
  <line x1="60" y1="60" x2="740" y2="60" class="thin" />
  <line x1="60" y1="60" x2="60" y2="139" class="thin" />
  <line x1="740" y1="60" x2="740" y2="139" class="thin" />
  <rect x="105" y="96" width="9" height="9" class="col" />
  <rect x="285" y="96" width="9" height="9" class="col" />
  <rect x="507" y="96" width="9" height="9" class="col" />
  <rect x="687" y="96" width="9" height="9" class="col" />
  <text x="400" y="108" class="lbl" text-anchor="middle">Varanda</text>

  <!-- Perímetro da casa fechada -->
  <line x1="60" y1="139" x2="394" y2="139" class="wall" />
  <line x1="443" y1="139" x2="740" y2="139" class="wall" />   <!-- frente com porta de entrada -->
  <line x1="60" y1="540" x2="740" y2="540" class="wall" />
  <line x1="60" y1="139" x2="60" y2="540" class="wall" />
  <line x1="740" y1="139" x2="740" y2="540" class="wall" />

  <!-- Divisória social/íntima (z=5) -->
  <line x1="60" y1="342" x2="153" y2="342" class="wall" />
  <line x1="202" y1="342" x2="344" y2="342" class="wall" />
  <line x1="394" y1="342" x2="555" y2="342" class="wall" />
  <line x1="604" y1="342" x2="740" y2="342" class="wall" />

  <!-- Sala | Hall  e  Hall | Cozinha -->
  <line x1="344" y1="139" x2="344" y2="229" class="wall" />
  <line x1="344" y1="275" x2="344" y2="342" class="wall" />
  <line x1="505" y1="139" x2="505" y2="229" class="wall" />
  <line x1="505" y1="275" x2="505" y2="342" class="wall" />

  <!-- Suíte | Banho  e  Banho | Quarto -->
  <line x1="307" y1="342" x2="307" y2="376" class="wall" />
  <line x1="307" y1="421" x2="307" y2="540" class="wall" />
  <line x1="418" y1="342" x2="418" y2="421" class="wall" />
  <line x1="418" y1="466" x2="418" y2="540" class="wall" />

  <!-- Portas (arcos) -->
  <path d="M394 139 A49 49 0 0 1 443 188" class="door" />
  <path d="M344 229 A46 46 0 0 1 390 275" class="door" />
  <path d="M153 342 A49 49 0 0 1 202 391" class="door" />

  <!-- Janelas (linhas duplas nas paredes) -->
  <line x1="146" y1="139" x2="258" y2="139" class="thin" /><line x1="146" y1="133" x2="258" y2="133" class="thin" />
  <line x1="560" y1="139" x2="672" y2="139" class="thin" /><line x1="560" y1="133" x2="672" y2="133" class="thin" />
  <line x1="60" y1="185" x2="60" y2="275" class="thin" /><line x1="66" y1="185" x2="66" y2="275" class="thin" />
  <line x1="60" y1="388" x2="60" y2="488" class="thin" /><line x1="66" y1="388" x2="66" y2="488" class="thin" />
  <line x1="740" y1="388" x2="740" y2="488" class="thin" /><line x1="734" y1="388" x2="734" y2="488" class="thin" />
  <line x1="523" y1="540" x2="635" y2="540" class="thin" /><line x1="523" y1="546" x2="635" y2="546" class="thin" />

  <!-- Rótulos -->
  <text x="202" y="238" class="lbl" text-anchor="middle">Sala de Estar</text>
  <text x="425" y="238" class="lbl" text-anchor="middle">Hall / Jantar</text>
  <text x="623" y="238" class="lbl" text-anchor="middle">Cozinha</text>
  <text x="184" y="445" class="lbl" text-anchor="middle">Suíte</text>
  <text x="363" y="445" class="lbl" text-anchor="middle">Banho</text>
  <text x="579" y="445" class="lbl" text-anchor="middle">Quarto</text>

  <!-- Cotas -->
  <text x="400" y="580" class="dim" text-anchor="middle">11,00 m</text>
  <text x="30" y="305" class="dim" text-anchor="middle" transform="rotate(-90 30 305)">8,50 m</text>
</svg>
