<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <style>
      .duct { stroke: #34d399; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; fill: none; opacity: 0.85; filter: drop-shadow(0 0 5px #34d399); }
      .unit { fill: none; stroke: #6ee7b7; stroke-width: 3; filter: drop-shadow(0 0 5px #34d399); }
      .flow { stroke: #a7f3d0; stroke-width: 2; stroke-dasharray: 4 6; fill: none; }
      .tag  { fill: #6ee7b7; font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 800; }
    </style>
  </defs>

  <!-- Condensadora (fundo direito) -->
  <rect x="680" y="500" width="40" height="26" rx="4" class="unit" />
  <text x="662" y="495" class="tag">Condensadora</text>

  <!-- Tubulação -->
  <path class="duct" d="M700 500 L700 220 L232 220" />       <!-- ramo Sala -->
  <path class="duct" d="M700 500 L620 500 L620 460" />       <!-- ramo Quarto -->
  <path class="duct" d="M700 500 L220 500 L220 460" />       <!-- ramo Suíte -->

  <!-- Evaporadoras (splits) -->
  <rect x="172" y="212" width="60" height="16" rx="8" class="unit" />
  <rect x="549" y="452" width="60" height="16" rx="8" class="unit" />
  <rect x="190" y="452" width="60" height="16" rx="8" class="unit" />

  <!-- Exaustor do banheiro -->
  <circle cx="363" cy="450" r="13" class="unit" />
  <path class="unit" d="M363 440 L363 460 M353 450 L373 450 M356 443 L370 457 M370 443 L356 457" stroke-width="2" />

  <text x="172" y="205" class="tag">Split Sala 12.000</text>
  <text x="525" y="445" class="tag">Split Quarto 9.000</text>
  <text x="182" y="445" class="tag">Split Suíte 9.000</text>
  <text x="332" y="485" class="tag">Exaustor Banho</text>
</svg>
