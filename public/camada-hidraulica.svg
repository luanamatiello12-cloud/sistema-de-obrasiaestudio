<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <style>
      .pipe { stroke: #38bdf8; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; filter: drop-shadow(0 0 4px #38bdf8); }
      .hot  { stroke: #f87171; stroke-width: 4; stroke-linecap: round; fill: none; filter: drop-shadow(0 0 4px #f87171); }
      .node { fill: #38bdf8; filter: drop-shadow(0 0 5px #38bdf8); }
      .tag  { fill: #7dd3fc; font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 800; }
    </style>
  </defs>

  <!-- Coluna / cozinha (canto superior direito) -->
  <path class="pipe" d="M700 150 L700 300 L560 300" />
  <path class="hot"  d="M712 150 L712 312 L560 312" />
  <circle cx="560" cy="300" r="6" class="node" />
  <text x="500" y="295" class="tag">Cozinha</text>

  <!-- Banho (inferior meio) -->
  <path class="pipe" d="M700 150 L700 470 L360 470" />
  <path class="hot"  d="M712 470 L360 470" />
  <circle cx="360" cy="470" r="6" class="node" />
  <text x="320" y="460" class="tag">Banho</text>
  <!-- esgoto -->
  <path class="pipe" d="M340 470 L340 540" stroke="#64748b" />

  <!-- Suíte (lavabo/pia) -->
  <path class="pipe" d="M360 470 L200 470 L200 430" />
  <circle cx="200" cy="430" r="6" class="node" />
  <text x="160" y="425" class="tag">Suíte</text>

  <text x="710" y="145" class="tag">Coluna AF/AQ</text>
</svg>
