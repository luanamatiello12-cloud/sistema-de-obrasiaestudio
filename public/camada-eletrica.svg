<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <style>
      .wire { stroke: #facc15; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 2 8; fill: none; filter: drop-shadow(0 0 4px #facc15); }
      .point { fill: #fde047; filter: drop-shadow(0 0 5px #facc15); }
      .tag  { fill: #fde047; font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 800; }
    </style>
  </defs>

  <!-- Quadro de distribuição (junto à entrada) -->
  <rect x="418" y="150" width="26" height="20" fill="none" stroke="#facc15" stroke-width="3" filter="drop-shadow(0 0 4px #facc15)" />
  <text x="448" y="148" class="tag">Quadro (QDC)</text>

  <!-- Barramento -->
  <path class="wire" d="M431 170 L431 238 L202 238" />
  <path class="wire" d="M431 238 L623 238" />
  <path class="wire" d="M431 238 L431 445 L184 445" />
  <path class="wire" d="M431 445 L363 445" />
  <path class="wire" d="M431 445 L579 445" />
  <path class="wire" d="M425 238 L425 238" />

  <!-- Luminárias -->
  <circle cx="202" cy="238" r="6" class="point" />
  <circle cx="425" cy="238" r="6" class="point" />
  <circle cx="623" cy="238" r="6" class="point" />
  <circle cx="184" cy="445" r="6" class="point" />
  <circle cx="363" cy="445" r="6" class="point" />
  <circle cx="579" cy="445" r="6" class="point" />

  <text x="150" y="228" class="tag">Luz Sala</text>
  <text x="600" y="228" class="tag">Luz Cozinha</text>
  <text x="150" y="435" class="tag">Luz Suíte</text>
  <text x="335" y="470" class="tag">Luz Banho</text>
  <text x="555" y="435" class="tag">Luz Quarto</text>
</svg>
