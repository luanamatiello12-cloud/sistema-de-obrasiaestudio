<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <style>
      .wire { stroke: #facc15; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 2 8; fill: none; filter: drop-shadow(0 0 4px #facc15); }
      .point { fill: #fde047; filter: drop-shadow(0 0 5px #facc15); }
      .tag { fill: #fde047; font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 800; }
    </style>
  </defs>

  <!-- Quadro de distribuição -->
  <rect x="100" y="90" width="26" height="20" fill="none" stroke="#facc15" stroke-width="3" filter="drop-shadow(0 0 4px #facc15)" />

  <!-- Barramento principal -->
  <path class="wire" d="M113 110 L113 200" />
  <path class="wire" d="M113 200 L575 200" />

  <!-- Circuitos de iluminação -->
  <path class="wire" d="M230 200 L230 136" />                 <!-- Sala -->
  <path class="wire" d="M575 200 L575 136" />                 <!-- Cozinha -->
  <path class="wire" d="M575 200 L655 200 L655 229" />        <!-- Área de serviço -->
  <path class="wire" d="M360 200 L360 324" />                 <!-- Corredor -->
  <path class="wire" d="M113 200 L113 430 L150 430" />        <!-- Suíte -->
  <path class="wire" d="M360 324 L320 324 L320 366" />        <!-- Banho (derivação do corredor) -->
  <path class="wire" d="M575 200 L575 464" />                 <!-- Quarto -->

  <!-- Luminárias -->
  <circle cx="230" cy="130" r="6" class="point" />
  <circle cx="575" cy="130" r="6" class="point" />
  <circle cx="655" cy="235" r="6" class="point" />
  <circle cx="360" cy="330" r="6" class="point" />
  <circle cx="320" cy="372" r="6" class="point" />
  <circle cx="150" cy="430" r="6" class="point" />
  <circle cx="575" cy="470" r="6" class="point" />

  <text x="130" y="88" class="tag">Quadro (QDC)</text>
  <text x="200" y="120" class="tag">Luz Sala</text>
  <text x="545" y="120" class="tag">Luz Cozinha</text>
  <text x="600" y="228" class="tag">Luz Á. Serviço</text>
  <text x="372" y="334" class="tag">Luz Corredor</text>
  <text x="300" y="362" class="tag">Luz Banho</text>
  <text x="120" y="450" class="tag">Luz Suíte</text>
  <text x="545" y="490" class="tag">Luz Quarto</text>
</svg>
