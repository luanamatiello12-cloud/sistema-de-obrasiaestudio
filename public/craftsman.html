// ---------- deterministic PRNG ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rng = mulberry32(20260714);
const rand=(a,b)=>a+(b-a)*rng();
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
// PRNGs POR SUBSISTEMA (determinismo: mexer numa textura não re-rola a vegetação)
const rngVeg=mulberry32(101), rndV=(a,b)=>a+(b-a)*rngVeg();
const rngFen=mulberry32(202), rndF=(a,b)=>a+(b-a)*rngFen();
const rngTre=mulberry32(303), rndT=(a,b)=>a+(b-a)*rngTre();
const rngSto=mulberry32(404), rndS=(a,b)=>a+(b-a)*rngSto();

// ============================================================
// CÉUS POR HORA — 5 estados equirect pré-computados no load
// (PMREM por frame é caro demais: environment = estado mais próximo,
//  background = SKYDOME com crossfade de 2 materiais)
// ============================================================
function buildSky(o){
  // o: {stops:[[t,c]..], glows:[[u,alpha,cor]..], stars, clouds:{n,col,a0,a1}, moon:[u]}
  const W=1536,H=768, cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const g=cv.getContext('2d');
  const rl=mulberry32(777), rr=(a,b)=>a+(b-a)*rl();
  const grd=g.createLinearGradient(0,0,0,H);
  for(const [t,c] of o.stops) grd.addColorStop(t,c);
  g.fillStyle=grd; g.fillRect(0,0,W,H);
  for(const [u,alpha,cor] of (o.glows||[])){
    const x=u*W, y=H*0.497;
    const hg=g.createRadialGradient(x,y,0,x,y,300);
    hg.addColorStop(0,`rgba(${cor},${alpha})`); hg.addColorStop(0.5,`rgba(${cor},${alpha*0.35})`);
    hg.addColorStop(1,'rgba(0,0,0,0)');
    g.save(); g.translate(x,y); g.scale(1,0.28); g.translate(-x,-y);
    g.fillStyle=hg; g.beginPath(); g.arc(x,y,300,0,7); g.fill(); g.restore();
  }
  const cl=o.clouds||{n:22,col:'8,14,30',a0:0.1,a1:0.24};
  for(let i=0;i<cl.n;i++){ const y=rr(H*0.16,H*0.46), x=rl()*W, w=rr(W*0.06,W*0.22), h=rr(5,16);
    const cg=g.createRadialGradient(x,y,0,x,y,w);
    cg.addColorStop(0,`rgba(${cl.col},${rr(cl.a0,cl.a1)})`); cg.addColorStop(1,'rgba(0,0,0,0)');
    g.save(); g.translate(x,y); g.scale(1,h/w);
    g.fillStyle=cg; g.beginPath(); g.arc(0,0,w,0,7); g.fill(); g.restore(); }
  if(o.stars) for(let i=0;i<o.stars;i++){ const x=rl()*W, y=rl()*H*0.36, s=rr(0.5,1.7);
    g.fillStyle=`rgba(220,230,255,${rr(.15,.8)})`; g.fillRect(x,y,s,s); }
  if(o.moon){ const mx=o.moon[0]*W, my=H*0.18;
    const mg=g.createRadialGradient(mx,my,2,mx,my,60);
    mg.addColorStop(0,'rgba(235,240,255,0.95)'); mg.addColorStop(0.12,'rgba(220,230,252,0.8)');
    mg.addColorStop(0.3,'rgba(190,205,240,0.16)'); mg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=mg; g.beginPath(); g.arc(mx,my,60,0,7); g.fill(); }
  const dome=new THREE.CanvasTexture(cv); dome.colorSpace=THREE.SRGBColorSpace;
  const env=new THREE.CanvasTexture(cv);
  env.mapping=THREE.EquirectangularReflectionMapping; env.colorSpace=THREE.SRGBColorSpace;
  return {dome, env};
}
const SKY_DEFS={
  noite:{ stops:[[0,'#02060f'],[0.2,'#04102a'],[0.38,'#0a1a38'],[0.47,'#14233f'],[0.495,'#1d2b47'],

    glows:[], stars:340, clouds:{n:18,col:'4,8,18',a0:0.10,a1:0.22}, moon:[0.62] },
  madrugada:{ stops:[[0,'#1b2a50'],[0.2,'#2c3e68'],[0.38,'#5c688f'],[0.465,'#b98a7e'],[0.495,'#f0b088'],
      [0.502,'#3a3830'],[0.7,'#15161c'],[1,'#08090d']],
    glows:[[0.28,0.42,'255,170,120'],[0.30,0.2,'255,210,160']], stars:60,
    clouds:{n:22,col:'40,44,70',a0:0.10,a1:0.22} },
  dia:{ stops:[[0,'#396ab4'],[0.2,'#5585c6'],[0.38,'#87abd8'],[0.47,'#b8cee6'],[0.495,'#d5e2ee'],
      [0.502,'#43503c'],[0.7,'#242b1e'],[1,'#11150d']],
    glows:[[0.5,0.10,'255,255,245']], stars:0,
    clouds:{n:26,col:'250,252,255',a0:0.18,a1:0.42} },
  golden:{ stops:[[0,'#3c5490'],[0.2,'#5c6a9c'],[0.38,'#93799a'],[0.455,'#d89070'],[0.495,'#ffb46a'],
      [0.502,'#3a3126'],[0.7,'#171410'],[1,'#0a0908']],
    glows:[[0.30,0.5,'255,164,84'],[0.78,0.18,'236,150,110']], stars:0,
    clouds:{n:24,col:'90,58,52',a0:0.12,a1:0.26} },
  blue:{ stops:[[0,'#050d20'],[0.2,'#0a1c40'],[0.38,'#173263'],[0.465,'#3d5384'],[0.495,'#7b83a6'],
      [0.502,'#2c3247'],[0.7,'#12151f'],[1,'#05070c']],
    glows:[[0.30,0.30,'196,120,92'],[0.78,0.16,'150,96,110']], stars:150,
    clouds:{n:26,col:'8,14,30',a0:0.10,a1:0.24} },
};
window.__stage='pre-skies';
const SKIES={}; const pmrem=new THREE.PMREMGenerator(renderer);
for(const k in SKY_DEFS){ const s=buildSky(SKY_DEFS[k]);
  SKIES[k]={dome:s.dome, env:pmrem.fromEquirectangular(s.env).texture}; s.env.dispose(); }
window.__stage='skies-ok';
// âncoras hora->estado (wrap 24h)
const SKY_TRACK=[[0,'noite'],[4.6,'noite'],[6.3,'madrugada'],[8.6,'dia'],[15.8,'dia'],
                 [17.9,'golden'],[19.15,'blue'],[20.5,'noite'],[24,'noite']];
// skydome: 2 cascas pra crossfade (dentro do far=400, fog OFF nos materiais)

const domeB=new THREE.Mesh(domeGeo,domeMatB); domeB.renderOrder=-1; domeB.name='ceu-b'; domeB.visible=false; scene.add(domeB);
scene.environment=SKIES.blue.env;
scene.fog=new THREE.Fog(0x0d1526, 42, 190);

// ============================================================
// TEXTURAS PROCEDURAIS
// ============================================================
function mkTex(cv,srgb,rep){ const t=new THREE.CanvasTexture(cv); t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.anisotropy=8; if(rep)t.repeat.set(rep[0],rep[1]); if(srgb)t.colorSpace=THREE.SRGBColorSpace; return t; }
function bumpToNormal(bumpCv,strength){
  const s=bumpCv.width, src=bumpCv.getContext('2d').getImageData(0,0,s,s).data;
  const out=document.createElement('canvas'); out.width=out.height=s;
  const od=out.getContext('2d').createImageData(s,s);
  const Hf=(x,y)=>{x=(x+s)%s;y=(y+s)%s;return src[(y*s+x)*4]/255;};
  for(let y=0;y<s;y++)for(let x=0;x<s;x++){
    const dx=(Hf(x-1,y)-Hf(x+1,y))*strength, dy=(Hf(x,y-1)-Hf(x,y+1))*strength;
    let nx=dx,ny=dy,nz=1; const l=Math.hypot(nx,ny,nz); nx/=l;ny/=l;nz/=l;
    const i=(y*s+x)*4; od.data[i]=(nx*0.5+0.5)*255; od.data[i+1]=(ny*0.5+0.5)*255; od.data[i+2]=(nz*0.5+0.5)*255; od.data[i+3]=255;
  }
  out.getContext('2d').putImageData(od,0,0);
  return mkTex(out,false);
}

// ---- SHINGLE de parede (cinza-azulado, fileiras legíveis) — tile = 2.2m x 2.2m ----
function shingleTextures(size, baseCols, rowM, worldM){
  const alb=document.createElement('canvas'); alb.width=alb.height=size;
  const bmp=document.createElement('canvas'); bmp.width=bmp.height=size;
  const rgh=document.createElement('canvas'); rgh.width=rgh.height=size;
  const a=alb.getContext('2d'), b=bmp.getContext('2d'), r=rgh.getContext('2d');
  const rows=Math.round(worldM/rowM), rh=size/rows;
  a.fillStyle=baseCols[0]; a.fillRect(0,0,size,size);
  b.fillStyle='#909090'; b.fillRect(0,0,size,size);
  r.fillStyle='#e2e2e2'; r.fillRect(0,0,size,size);
  const shW=rh*0.62;
  for(let ry=0;ry<rows;ry++){
    const y0=ry*rh, stag=(ry%2)*shW*0.5;
    for(let x0=-shW;x0<size+shW;x0+=shW){
      const x=x0+stag+rand(-1.5,1.5);
      const c=baseCols[(rng()*baseCols.length)|0];
      a.fillStyle=c; a.fillRect(x,y0,shW-1.4,rh);
      const sh=rand(-0.10,0.10);
      a.fillStyle=sh>0?`rgba(255,255,255,${sh})`:`rgba(6,10,14,${-sh})`;
      a.fillRect(x,y0,shW-1.4,rh);
      // fresta vertical entre shingles
      a.fillStyle='rgba(10,14,18,0.55)'; a.fillRect(x+shW-2.4,y0,1.6,rh);
      b.fillStyle='rgba(30,30,30,0.8)'; b.fillRect(x+shW-2.4,y0,1.6,rh);
      const v=200+rand(-28,18)|0; b.fillStyle=`rgba(${v},${v},${v},0.35)`; b.fillRect(x,y0,shW-2.6,rh);
    }
    // sombra da fileira (butt edge na base da fileira)
    a.fillStyle='rgba(6,9,13,0.45)'; a.fillRect(0,y0+rh*0.82,size,rh*0.18);
    b.fillStyle='rgba(12,12,12,0.95)'; b.fillRect(0,y0+rh*0.86,size,rh*0.14);
    b.fillStyle='rgba(235,235,235,0.7)'; b.fillRect(0,y0+rh*0.70,size,rh*0.14);
    r.fillStyle='rgba(255,255,255,0.25)'; r.fillRect(0,y0+rh*0.82,size,rh*0.18);
  }
  // mottle macro (desbotamento por chuva/sol)
  for(let i=0;i<26;i++){ const x=rng()*size,y=rng()*size,rd=rand(size*0.06,size*0.2);
    const g2=a.createRadialGradient(x,y,0,x,y,rd);
    g2.addColorStop(0,rng()>0.5?`rgba(210,220,228,${rand(.03,.08)})`:`rgba(20,30,40,${rand(.04,.09)})`);
    g2.addColorStop(1,'rgba(0,0,0,0)'); a.fillStyle=g2; a.beginPath(); a.arc(x,y,rd,0,7); a.fill(); }
  return {albedo:mkTex(alb,true), rough:mkTex(rgh,false), normal:bumpToNormal(bmp,2.6)};
}

// ---- PAVER (lajota) — tile 2m x 2m ----
function paverTextures(size){
  const alb=document.createElement('canvas'); alb.width=alb.height=size;
  const bmp=document.createElement('canvas'); bmp.width=bmp.height=size;
  const a=alb.getContext('2d'), b=bmp.getContext('2d');
  a.fillStyle='#a29c94'; a.fillRect(0,0,size,size);   // v10: pátio pavers claros ~#A5A09A (survey)
  b.fillStyle='#c8c8c8'; b.fillRect(0,0,size,size);
  const n=4, cw=size/n;
  for(let iy=0;iy<n;iy++)for(let ix=0;ix<n;ix++){
    const x=ix*cw, y=iy*cw, v=rand(-18,16);
    a.fillStyle=`rgb(${162+v|0},${156+v|0},${148+v|0})`; a.fillRect(x+2,y+2,cw-4,cw-4);
    for(let k=0;k<60;k++){ const px=x+rng()*cw, py=y+rng()*cw;
      a.fillStyle=`rgba(${rng()>0.5?'200,196,188':'70,66,60'},${rand(.03,.10)})`; a.fillRect(px,py,rand(1,3),rand(1,3)); }
  }
  // juntas escuras
  a.strokeStyle='rgba(28,26,24,0.85)'; a.lineWidth=4;
  b.strokeStyle='rgba(20,20,20,0.95)'; b.lineWidth=5;
  for(let i=0;i<=n;i++){ const p=i*cw;
    a.beginPath(); a.moveTo(0,p); a.lineTo(size,p); a.stroke();
    a.beginPath(); a.moveTo(p,0); a.lineTo(p,size); a.stroke();
    b.beginPath(); b.moveTo(0,p); b.lineTo(size,p); b.stroke();
    b.beginPath(); b.moveTo(p,0); b.lineTo(p,size); b.stroke(); }
  return {albedo:mkTex(alb,true), normal:bumpToNormal(bmp,2.2)};
}

// ---- CERCA madeira (tábuas verticais) — tile 2.4m x 1.85m ----
function fenceTextures(size){
  const alb=document.createElement('canvas'); alb.width=alb.height=size;
  const bmp=document.createElement('canvas'); bmp.width=bmp.height=size;
  const a=alb.getContext('2d'), b=bmp.getContext('2d');
  a.fillStyle='#5c3a26'; a.fillRect(0,0,size,size);   // v10: stain #5C3A26 (survey)
  b.fillStyle='#a0a0a0'; b.fillRect(0,0,size,size);
  const bw=size/16; // 16 tábuas de ~0.15m
  for(let i=0;i<16;i++){ const x=i*bw, v=rand(-16,16);
    a.fillStyle=`rgb(${92+v|0},${58+v*0.8|0},${38+v*0.6|0})`; a.fillRect(x+1,0,bw-3,size);
    for(let k=0;k<40;k++){ const px=x+rng()*bw, py=rng()*size;
      a.fillStyle=`rgba(${rng()>0.5?'130,96,60':'40,26,14'},${rand(.06,.2)})`; a.fillRect(px,py,rand(0.8,2),rand(6,30)); }
    a.fillStyle='rgba(16,10,6,0.8)'; a.fillRect(x+bw-2.6,0,2.6,size);
    b.fillStyle='rgba(30,30,30,0.9)'; b.fillRect(x+bw-2.6,0,2.6,size);
  }
  return {albedo:mkTex(alb,true), normal:bumpToNormal(bmp,2.0)};
}

// ---- MADEIRA porta ----
function woodTex(size){
  const alb=document.createElement('canvas'); alb.width=alb.height=size;
  const a=alb.getContext('2d');
  a.fillStyle='#84492b'; a.fillRect(0,0,size,size);   // v10: porta média-avermelhada ~#74432A pós-tint
  for(let i=0;i<130;i++){ const x=rng()*size, w=rand(1,4);
    a.strokeStyle=`rgba(${46+rand(0,50)|0},${26+rand(0,26)|0},${10+rand(0,14)|0},${rand(.15,.5)})`;

// ---- TUFO DE GRAMA (card com alpha do PRÓPRIO map) ----
function tuftTex(){
  const s=256, cv=document.createElement('canvas'); cv.width=cv.height=s;
  const g=cv.getContext('2d'); g.clearRect(0,0,s,s);
  const rl=mulberry32(9001), rr=(a,b)=>a+(b-a)*rl();
  for(let i=0;i<46;i++){
    const x0=s*0.5+rr(-s*0.16,s*0.16), tip=x0+rr(-s*0.34,s*0.34);
    const h=rr(s*0.45,s*0.95), w=rr(2.5,5.5);
    const gr=g.createLinearGradient(0,s,0,s-h);
    const dk=rr(0,1)>0.6;
    gr.addColorStop(0, dk?'#2c4418':'#3a5a20'); gr.addColorStop(1, dk?'#5a7a34':'#7a9a44');
    g.strokeStyle=gr; g.lineWidth=w; g.lineCap='round';
    g.beginPath(); g.moveTo(x0,s);
    g.quadraticCurveTo(x0+(tip-x0)*0.3, s-h*0.6, tip, s-h); g.stroke();
  }
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace;
  t.generateMipmaps=false; t.minFilter=THREE.LinearFilter;   // alphaTest some no mipmap
  return t;
}
// ---- CARD DE FOLHAGEM de árvore (cluster de folhinhas, alpha próprio) ----
function leafCardTex(){
  const s=256, cv=document.createElement('canvas'); cv.width=cv.height=s;
  const g=cv.getContext('2d'); g.clearRect(0,0,s,s);
  const rl=mulberry32(9002), rr=(a,b)=>a+(b-a)*rl();
  for(let i=0;i<70;i++){
    const a=rr(0,Math.PI*2), d=rr(0,s*0.40);
    const x=s/2+Math.cos(a)*d, y=s/2+Math.sin(a)*d*0.9;
    const r=rr(7,20), rot=rr(0,Math.PI);
    const v=rr(0,1);
    g.fillStyle=v>0.6?'#2c3d22':(v>0.25?'#243319':'#1b2814');
    g.save(); g.translate(x,y); g.rotate(rot); g.scale(1,rr(0.5,0.8));
    g.beginPath(); g.arc(0,0,r,0,7); g.fill(); g.restore();
  }
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace;
  t.generateMipmaps=false; t.minFilter=THREE.LinearFilter;
  return t;
}
// ---- VITRAL da porta (grade de vidro colorido sutil, aceso) ----
function vitralTex(){
  const W=256,H=256, cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const g=cv.getContext('2d');
  const rl=mulberry32(9003), rr=(a,b)=>a+(b-a)*rl();
  const cols=4, rows=5, cw=W/cols, ch=H/rows;
  const pal=['#ffd9a0','#ffc98a','#e8b070','#d9a0a8','#c9b088','#a8c0a0','#ffd9a0','#f0c890'];
  for(let iy=0;iy<rows;iy++)for(let ix=0;ix<cols;ix++){
    const border=(ix===0||ix===cols-1||iy===0||iy===rows-1);
    const c=border? pal[(rr(0,pal.length))|0] : (rr(0,1)>0.3?'#ffe4b8':'#ffd9a0');
    const gr=g.createRadialGradient(ix*cw+cw/2,iy*ch+ch*0.4,2, ix*cw+cw/2,iy*ch+ch*0.4,cw*0.8);
    gr.addColorStop(0,'#fff2d8'); gr.addColorStop(0.45,c); gr.addColorStop(1,c);
    g.fillStyle=gr; g.fillRect(ix*cw,iy*ch,cw,ch);
  }
  g.strokeStyle='#3a3026'; g.lineWidth=5;
  for(let i=0;i<=cols;i++){ g.beginPath(); g.moveTo(i*cw,0); g.lineTo(i*cw,H); g.stroke(); }
  for(let i=0;i<=rows;i++){ g.beginPath(); g.moveTo(0,i*ch); g.lineTo(W,i*ch); g.stroke(); }
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; return t;
}

// UVs em espaço de mundo (projeção por eixo dominante da normal)
function rewriteUV(geo, su, sv){
  const pos=geo.attributes.position, nor=geo.attributes.normal;
  const uv=new Float32Array(pos.count*2);
  for(let i=0;i<pos.count;i++){
    const nx=Math.abs(nor.getX(i)), ny=Math.abs(nor.getY(i)), nz=Math.abs(nor.getZ(i));
    let u,v;
    if(ny>=nx&&ny>=nz){ u=pos.getX(i)*su; v=pos.getZ(i)*su; }
    else if(nx>=nz){ u=pos.getZ(i)*su; v=pos.getY(i)*sv; }
    else { u=pos.getX(i)*su; v=pos.getY(i)*sv; }
    uv[i*2]=u; uv[i*2+1]=v;
  }
  geo.setAttribute('uv', new THREE.BufferAttribute(uv,2));
}

// parede com furos (extrude no plano XY, face externa = z do matrix + depth)
const WT=0.22;
function holedWall(part,key,pts,holes,faceMatrix,t=WT){
  const shape=new THREE.Shape(pts.map(p=>new THREE.Vector2(p[0],p[1])));
  for(const h of holes){
    if(h.circle){ const path=new THREE.Path(); path.absarc(h.circle[0],h.circle[1],h.circle[2],0,Math.PI*2,true); shape.holes.push(path); }
    else { const path=new THREE.Path(h.map(p=>new THREE.Vector2(p[0],p[1]))); shape.holes.push(path); }
  }
  const geo=new THREE.ExtrudeGeometry(shape,{depth:t,bevelEnabled:false,steps:1});
  geo.applyMatrix4(faceMatrix);
  addG(part,key,geo);
}

// M4 leva o frame local (origem no centro do vão, face externa z=0, fora=+z)
// v9: cada vidro vira mesh INDIVIDUAL clicável (coletados aqui, montados pós-merge)
// ============================================================
const clickGlass=[], clickFix=[];   // v9: janelas + arandelas/pendentes clicáveis
function windowUnit(part,M4,ow,oh,cols=2,rows=2,opts={}){
  const L=(geo,dx,dy,dz)=>{ geo.translate(dx||0,dy||0,dz||0); geo.applyMatrix4(M4); return geo; };
  // 'surface': montada sobre parede-caixa (sem furo) -> tudo pra fora da face
  const S=!!opts.surface;
  const gz=S? 0.030:-0.14, jz=S? 0.065:-0.10, jd=S? 0.13:0.20, mz=S? 0.058:-0.075;
  // vidro aceso (recuado no furo / à frente na surface) — v9.1: pane individual + hit-proxy 60% maior (mín 0.9m)
  const gG=new THREE.PlaneGeometry(ow-0.04,oh-0.04); gG.translate(0,0,gz); gG.applyMatrix4(M4);
  const gH=new THREE.PlaneGeometry(Math.max(ow*1.6,0.9),Math.max(oh*1.6,0.9)); gH.translate(0,0,gz); gH.applyMatrix4(M4);
  clickGlass.push({geo:gG, hit:gH, zone:+((opts.zone||'glassZ0').slice(-1)), blind:!!opts.blind});
  // jambas (batente 3D)
  addG(part,'trim', L(box(0.06,oh,jd, -(ow/2-0.03),0,jz)));
  addG(part,'trim', L(box(0.06,oh,jd,  (ow/2-0.03),0,jz)));
  addG(part,'trim', L(box(ow,0.06,jd, 0, (oh/2-0.03),jz)));
  addG(part,'trim', L(box(ow,0.06,jd, 0,-(oh/2-0.03),jz)));
  // travessas (grade)
  for(let c=1;c<cols;c++) addG(part,'trim', L(box(0.045,oh-0.08,0.045, -ow/2+c*ow/cols,0,mz)));
  for(let r=1;r<rows;r++) addG(part,'trim', L(box(ow-0.08,0.045,0.045, 0,-oh/2+r*oh/rows,mz)));
  if(opts.bay){
    // v10 (survey): janelão em CAIXA SALIENTE — laterais profundas, VERGA/entablamento
    // profundo sobre mísulas, peitoril projetado
    const cz=0.02;
    addG(part,'trim', L(box(0.16,oh+0.16,0.26, -(ow/2+0.08),0,cz+0.06)));
    addG(part,'trim', L(box(0.16,oh+0.16,0.26,  (ow/2+0.08),0,cz+0.06)));
    addG(part,'trim', L(box(ow+0.62,0.16,0.34, 0, oh/2+0.16, cz+0.10)));     // entablamento
    addG(part,'trim', L(box(ow+0.50,0.07,0.28, 0, oh/2+0.055, cz+0.08)));    // filete sob a verga
    for(const sx of [-1,1]){                                                 // mísulas da verga
      addG(part,'trim', L(box(0.09,0.14,0.24, sx*(ow/2+0.14), oh/2-0.02, cz+0.07)));
      addG(part,'trim', L(box(0.07,0.09,0.18, sx*(ow/2+0.14), oh/2-0.135, cz+0.04)));
    }
    addG(part,'trim', L(box(ow+0.44,0.09,0.26, 0,-(oh/2+0.045), cz+0.06)));  // peitoril saliente
  } else if(!opts.noCasing){
    // casing plano largo (craftsman) na face da parede
    const cz=S? 0.035:0.02;
    addG(part,'trim', L(box(0.14,oh+0.10,0.045, -(ow/2+0.07),0,cz)));
    addG(part,'trim', L(box(0.14,oh+0.10,0.045,  (ow/2+0.07),0,cz)));
    addG(part,'trim', L(box(ow+0.42,0.17,0.055, 0, oh/2+0.115,cz+0.005)));   // header board
    addG(part,'trim', L(box(ow+0.30,0.08,0.15, 0,-(oh/2+0.04),cz+0.03)));    // peitoril
  }
}

// mísula/bracket craftsman ORNAMENTADA: perfil recortado (topo reto + degrau + curva côncava + pezinho)
function ornateBracket(part,key,bx,topY,zBack,s=1){
  const sh=new THREE.Shape();
  sh.moveTo(0,0); sh.lineTo(0.55*s,0);                       // topo sob o beiral
  sh.lineTo(0.55*s,-0.10*s); sh.lineTo(0.44*s,-0.10*s);      // degrau externo
  sh.lineTo(0.44*s,-0.18*s);
  sh.quadraticCurveTo(0.40*s,-0.42*s, 0.10*s,-0.46*s);       // curva côncava
  sh.lineTo(0.10*s,-0.56*s); sh.lineTo(0,-0.56*s);           // pezinho contra a parede
  sh.closePath();
  const g=new THREE.ExtrudeGeometry(sh,{depth:0.09,bevelEnabled:false,steps:1});
  g.rotateY(-Math.PI/2);            // saliência em +z, espessura em x
  g.translate(bx+0.045, topY, zBack);
  addG(part,key,g);
}
function slopeQuad(part,key,a,b,c,d){
  const pos=[...a,...b,...c, ...a,...c,...d];
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.computeVertexNormals();
  const n=g.attributes.position.count;
  g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(n*2),2));
  addG(part,key,g);
}

const leafCards=[];
(function(){
  const UP=new THREE.Vector3(0,1,0), Q=new THREE.Quaternion(), V=new THREE.Vector3(), MID=new THREE.Vector3();
  function tree(tx,tz,H,seed){
    const rl=mulberry32(seed), rr=(a,b)=>a+(b-a)*rl();
    function branch(px,py,pz,dx,dy,dz,len,rad,depth){
      const ex=px+dx*len, ey=py+dy*len, ez=pz+dz*len;
      const sg=depth>=3?6:4;
      const g=new THREE.CylinderGeometry(rad*0.76, rad, len, sg, 1, true);
      MID.set((px+ex)/2,(py+ey)/2,(pz+ez)/2);
      V.set(dx,dy,dz).normalize();
      Q.setFromUnitVectors(UP, V);
      g.applyMatrix4(new THREE.Matrix4().compose(MID, Q, new THREE.Vector3(1,1,1)));
      addG('arvores','tree',g);
      if(depth===0){
        leafCards.push({p:[ex,ey,ez], s:rr(1.0,1.6)});
        if(rl()>0.45) leafCards.push({p:[ex+rr(-0.5,0.5),ey+rr(0.05,0.55),ez+rr(-0.5,0.5)], s:rr(0.9,1.4)});
        return;
      }
      const nc=depth>=3?3:(rl()>0.4?3:2);
      for(let i=0;i<nc;i++){
        const nd=new THREE.Vector3(dx+rr(-0.95,0.95), dy*0.62+rr(0.18,0.62), dz+rr(-0.95,0.95)).normalize();
        branch(ex,ey,ez, nd.x,nd.y,nd.z, len*rr(0.55,0.75), rad*0.64, depth-1);
      }
      if(depth===1 && rl()>0.5) leafCards.push({p:[ex,ey,ez], s:rr(1.0,1.5)});
    }
    branch(tx,0,tz, rr(-0.06,0.06),1,rr(-0.06,0.06), H*0.34, H*0.034, 4);
  }
  tree(-6.0,-9.2, 8.4, 51);
  tree( 0.8,-9.8, 9.2, 52);
  tree( 6.5,-9.0, 7.8, 53);
  tree(12.6,-6.4, 6.9, 54);    // v10 (survey): SEM árvore grande no lote — fundo, atrás da cerca dir
  tree(-12.7,-6.2, 9.8, 55);   // v10 (survey): fundo, atrás da cerca esquerda
})();

function triCount(g){ return g.index? g.index.count/3 : g.attributes.position.count/3; }
let beforeCalls=0, beforeTris=0, beforeVerts=0;
for(const p in bags) for(const k in bags[p]) for(const g of bags[p][k]){
  beforeCalls++; beforeTris+=triCount(g); beforeVerts+=g.attributes.position.count;
}
// + instâncias contadas como meshes individuais no "antes"

             + fenceBoards.length + stoneSpots.length + tuftSpots.length + leafCards.length + window.__wreathLeaves.length
             + clickGlass.length + clickFix.length;   // v9: panes e globos individuais

// ============================================================
// MERGE por material dentro de cada parte + instancing
// ============================================================
window.__stage='pre-merge';
const root=new THREE.Group(); root.name='cena'; scene.add(root);
const UVW={ shingle:[1/2.2,1/2.2], roof:[1/2.2,1/2.2], paver:[1/2.0,1/2.0], paverF:[1/2.0,1/2.0], fence:[1/2.4,1/1.85], slab:[1/1.6,1/1.6] };
const MATKEY={ paverF:'paver' };
let afterCalls=0, afterTris=0, afterVerts=0;
const groups={};
for(const p of PARTS){
  const grp=new THREE.Group(); grp.name=p; root.add(grp); groups[p]=grp;
  for(const k in bags[p]){
    const list=bags[p][k]; if(!list.length) continue;
    const norm=list.map(g=>{
      if(!g.attributes.normal) g.computeVertexNormals();
      if(!g.attributes.uv){ const n=g.attributes.position.count;
        g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(n*2),2)); }
      for(const an of Object.keys(g.attributes)) if(an!=='position'&&an!=='normal'&&an!=='uv') g.deleteAttribute(an);
      return g.index? g.toNonIndexed() : g;
    });
    const merged=BufferGeometryUtils.mergeGeometries(norm,false);
    if(UVW[k]) rewriteUV(merged, UVW[k][0], UVW[k][1]);
    const matk=MATKEY[k]||k;
    const mesh=new THREE.Mesh(merged, M[matk]);
    mesh.name=`${p}-${k}`;
    const noShadow=(k==='pool'||k.startsWith('glass')||k==='glow');
    mesh.castShadow=!noShadow; mesh.receiveShadow=!noShadow;
    if(k==='pool'){ mesh.renderOrder=3; }
    grp.add(mesh);
    afterCalls++; afterTris+=triCount(merged); afterVerts+=merged.attributes.position.count;
  }
}

// ---------- 4) PÁSSAROS — 10 aves, 2 asas-triângulo cada, 1 mesh dinâmico ----------
const birds=(function(){
  const N=10, geo=new THREE.BufferGeometry();
  const pos=new Float32Array(N*6*3);
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const mat=new THREE.MeshBasicMaterial({color:0x141a22, side:THREE.DoubleSide, fog:true});
  const mesh=new THREE.Mesh(geo,mat); mesh.name='passaros'; mesh.frustumCulled=false;
  mesh.castShadow=false; mesh.visible=false; root.add(mesh); afterCalls++;
  const P=[]; const rl=mulberry32(606), rr=(a,b)=>a+(b-a)*rl();
  for(let i=0;i<N;i++) P.push({ rx:rr(5,10), rz:rr(4,8), cy:rr(10,13.5), cx:rr(-2,2), cz:rr(-2,3),
    w:rr(0.14,0.24)*(rl()>0.5?1:-1), ph:rr(0,6.28), flap:rr(6,10), s:rr(0.85,1.35) });
  const C=new THREE.Vector3(), D=new THREE.Vector3(), S=new THREE.Vector3(), UPv=new THREE.Vector3(0,1,0);
  function update(t){
    for(let i=0;i<N;i++){ const b=P[i], a=t*b.w+b.ph;
      C.set(b.cx+Math.cos(a)*b.rx, b.cy+Math.sin(a*2.3)*0.5, b.cz+Math.sin(a)*b.rz);
      D.set(-Math.sin(a)*b.rx, 0, Math.cos(a)*b.rz).normalize().multiplyScalar(Math.sign(b.w));
      S.crossVectors(D,UPv).normalize();
      const f=Math.sin(t*b.flap+b.ph)*0.85, o=i*18, s=b.s;
      // corpo: nariz e cauda; asas: pontas sobem/descem com o flap
      const nx=C.x+D.x*0.30*s, ny=C.y, nz=C.z+D.z*0.30*s;
      const tx=C.x-D.x*0.26*s, ty=C.y+0.03, tz=C.z-D.z*0.26*s;
      const wy=Math.sin(f)*0.42*s, wc=Math.cos(f)*0.55*s;
      pos[o]=nx; pos[o+1]=ny; pos[o+2]=nz;
      pos[o+3]=tx; pos[o+4]=ty; pos[o+5]=tz;
      pos[o+6]=C.x+S.x*wc; pos[o+7]=C.y+wy; pos[o+8]=C.z+S.z*wc;
      pos[o+9]=nx; pos[o+10]=ny; pos[o+11]=nz;
      pos[o+12]=tx; pos[o+13]=ty; pos[o+14]=tz;
      pos[o+15]=C.x-S.x*wc; pos[o+16]=C.y+wy; pos[o+17]=C.z-S.z*wc;
    }
    geo.attributes.position.needsUpdate=true;
  }
  update(0);
  return {mesh, update};
})();

const smoke=(function(){
  const N=44, g=new THREE.BufferGeometry();

  const rl=mulberry32(707);
  for(let i=0;i<N;i++){ p[i*3]=CHIMNEY_TOP[0]+ (rl()-0.5)*0.2; p[i*3+1]=CHIMNEY_TOP[1]; p[i*3+2]=CHIMNEY_TOP[2]+(rl()-0.5)*0.2;
    aT[i]=i/N; aS[i]=rl(); }
  g.setAttribute('position', new THREE.BufferAttribute(p,3));
  g.setAttribute('aT', new THREE.BufferAttribute(aT,1));
  g.setAttribute('aS', new THREE.BufferAttribute(aS,1));
  const mat=new THREE.ShaderMaterial({ transparent:true, depthWrite:false,
    uniforms:{ uTime:{value:0}, uMap:{value:SOFT}, uCol:{value:new THREE.Color(0.35,0.36,0.40)} },
    vertexShader:`uniform float uTime; attribute float aT; attribute float aS; varying float vA;
      void main(){ float life=fract(uTime*0.11*(0.75+0.5*aS)+aT);
        vec3 p=position; p.y+=life*3.8;

        gl_PointSize=(0.38+life*1.5)*(0.8+0.4*aS)*1100.0/-mv.z;
        gl_Position=projectionMatrix*mv; }`,
    fragmentShader:`uniform sampler2D uMap; uniform vec3 uCol; varying float vA;
      void main(){ float a=texture2D(uMap,gl_PointCoord).a*vA; gl_FragColor=vec4(uCol,a); }`});
  const pts=new THREE.Points(g,mat); pts.name='fumaca'; pts.frustumCulled=false; pts.renderOrder=5;

window.__sculptValidate=function(){
  const report={parts:[], issues:[], counts:{meshes:0, instanced:0, tris:0}};
  const bx=new THREE.Box3(), v=new THREE.Vector3();
  root.updateMatrixWorld(true);
  root.traverse(o=>{
    if(o.isMesh){
      report.counts.meshes++; if(o.isInstancedMesh) report.counts.instanced++;
      const g=o.geometry;
      report.counts.tris+=Math.round((g.index?g.index.count:g.attributes.position.count)/3)*(o.isInstancedMesh?o.count:1);
      const pos=g.attributes.position.array;
      for(let i=0;i<Math.min(pos.length,30000);i++){
        if(!isFinite(pos[i])){ report.issues.push({sev:'error', part:o.name||'(anon)', what:'NaN/Inf vertex'}); break; } }
    }
  });
  const asm=(root.userData.sculptRuntime&&root.userData.sculptRuntime.assembly)||[];
  for(const part of asm){
    const node=root.getObjectByName(part.id);
    if(!node){ report.issues.push({sev:'error', part:part.id, what:'declared in assembly but missing in scene'}); continue; }
    bx.setFromObject(node); const size=bx.getSize(v.clone());
    const entry={id:part.id, bbox:[+size.x.toFixed(2),+size.y.toFixed(2),+size.z.toFixed(2)], minY:+bx.min.y.toFixed(3)};
    if(part.expectDims){
      for(let a=0;a<3;a++){ const e=part.expectDims[a], m=[size.x,size.y,size.z][a];
        if(e>0.01 && (m<e*0.75||m>e*1.25)) report.issues.push({sev:'warn', part:part.id, what:`dim[${a}] ${m.toFixed(2)} vs expected ${e}`}); }
    }
    if(part.grounded && bx.min.y>0.06) report.issues.push({sev:'error', part:part.id, what:`floating: minY=${bx.min.y.toFixed(3)}`});
    if(part.socket && !(root.userData.sculptRuntime.sockets||{})[part.socket])
      report.issues.push({sev:'error', part:part.id, what:`socket '${part.socket}' not registered`});
    report.parts.push(entry);
  }
  report.ok=!report.issues.some(i=>i.sev==='error');
  return report;
};

  if(STATE.chuva){ si*=0.34; fi*=0.6; exp-=0.18; fogColTgt.lerp(_cb.setHex(0x4e5a66),0.55); }
  if(STATE.neve){ si*=0.8; fogColTgt.lerp(_cb.setHex(0x9fb2c4),0.35); sun.color.lerp(_cb.setHex(0xdfe8f8),0.3); }
  sun.intensity=si; fill.intensity=fi;
  renderer.toneMappingExposure=exp;
  // névoa alvo (lerp acontece no tick)
  const FT=[[95,430],[60,260],[13,64]][STATE.nevoa];
  fogTgt.near=FT[0]*(STATE.chuva?0.6:1); fogTgt.far=FT[1]*(STATE.chuva?0.55:1);
  applySky(h);
  // regras AUTO
  birds.mesh.visible = STATE.passaros && !isNoite(h);
  fireflies.pts.visible = STATE.vagalumes && isNoite(h);
  smoke.pts.visible = STATE.fumaca;
  smoke.mat.uniforms.uCol.value.setScalar(isDia(h)? 0.72:0.33);   // fumaça clara de dia, escura à noite
  applyLights();
  updateAudioMix();
  // rótulo do slider
  const hh=String(Math.floor(h)).padStart(2,'0'), mm=String(Math.round((h%1)*60)).padStart(2,'0');
  document.getElementById('horaLbl').textContent=(isDia(h)?'☀ ':'☾ ')+hh+':'+mm;
}

// ---------- bloom amarrado a luz/noite ----------
let bloomOn=true;
function bloomEff(){ return bloomOn && (luzesAcesas() || isNoite(STATE.hora)); }
function render(){ if(bloomEff()) composer.render(); else renderer.render(scene,camera); }
window.__setBloom=function(on){ bloomOn=!!on; STATE.bloom=bloomOn; refreshUI(); render(); return bloomOn; };

// ============================================================
// SOM AMBIENTE — 100% procedural (WebAudio); só nasce no 1º gesto
// ============================================================
let AC=null, AN=null;
function ensureAudio(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return true; }
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    const master=AC.createGain(); master.gain.value=0; master.connect(AC.destination);
    const noiseSrc=()=>{ const len=2*AC.sampleRate, buf=AC.createBuffer(1,len,AC.sampleRate);
      const d=buf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
      const s=AC.createBufferSource(); s.buffer=buf; s.loop=true; s.start(); return s; };
    // vento: noise grave contínuo com LFO
    const wf=AC.createBiquadFilter(); wf.type='lowpass'; wf.frequency.value=260; wf.Q.value=0.5;
    const wg=AC.createGain(); wg.gain.value=0;
    noiseSrc().connect(wf); wf.connect(wg); wg.connect(master);
    const wl=AC.createOscillator(); wl.frequency.value=0.13;
    const wlg=AC.createGain(); wlg.gain.value=70; wl.connect(wlg); wlg.connect(wf.frequency); wl.start();
    // chuva: noise shaped
    const rhp=AC.createBiquadFilter(); rhp.type='highpass'; rhp.frequency.value=420;
    const rlp=AC.createBiquadFilter(); rlp.type='lowpass'; rlp.frequency.value=6200;
    const rg=AC.createGain(); rg.gain.value=0;
    noiseSrc().connect(rhp); rhp.connect(rlp); rlp.connect(rg); rg.connect(master);
    // grilos: noise -> bandpass agudo, gain pulsado em bursts
    const cf=AC.createBiquadFilter(); cf.type='bandpass'; cf.frequency.value=4300; cf.Q.value=16;
    const cg=AC.createGain(); cg.gain.value=0;
    noiseSrc().connect(cf); cf.connect(cg); cg.connect(master);
    AN={master,wg,rg,cg};
    (function cricketLoop(){ if(!AC) return;
      if(STATE.som && isNoite(STATE.hora) && !STATE.chuva){
        const t0=AC.currentTime+0.05, n=3+(Math.random()*3|0);
        for(let k=0;k<n;k++){ const t=t0+k*0.078;
          cg.gain.setValueAtTime(0.0001,t); cg.gain.exponentialRampToValueAtTime(0.42,t+0.016);
          cg.gain.exponentialRampToValueAtTime(0.0001,t+0.062); } }
      setTimeout(cricketLoop, 420+Math.random()*950); })();
    (function birdChirpLoop(){ if(!AC) return;
      if(STATE.som && isDia(STATE.hora)){
        const o=AC.createOscillator(), og=AC.createGain();
        const f0=1900+Math.random()*1700, t=AC.currentTime+0.02;
        o.frequency.setValueAtTime(f0,t);
        o.frequency.exponentialRampToValueAtTime(f0*(1.25+Math.random()*0.4),t+0.07);
        o.frequency.exponentialRampToValueAtTime(f0*0.85,t+0.14);
        og.gain.setValueAtTime(0.0001,t); og.gain.exponentialRampToValueAtTime(0.13,t+0.02);
        og.gain.exponentialRampToValueAtTime(0.0001,t+0.17);
        o.connect(og); og.connect(AN.master); o.start(t); o.stop(t+0.22); }
      setTimeout(birdChirpLoop, 600+Math.random()*2600); })();
    return true;
  }catch(e){ AC=null; return false; }
}
// v9.1: SOM DE INTERRUPTOR — feedback de UI, toca SEMPRE que clicar numa luz (independe do
// botão de som ambiente: liga direto no destination, não passa pelo master gateado por STATE.som).
// O tap é gesto de usuário — AC nasce/resume preguiçosamente aqui. Liga = "tec" agudo; desliga = grave.
function switchSound(on){
  if(!ensureAudio()) return;
  try{
    const t=AC.currentTime+0.005;
    // estalo mecânico: burst de ruído ~30ms por bandpass (o "tec" real, não beep)
    const len=Math.max(1,Math.round(AC.sampleRate*0.03));
    const buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++){ const e=1-i/len; d[i]=(Math.random()*2-1)*e*e; }
    const ns=AC.createBufferSource(); ns.buffer=buf;
    const nf=AC.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=on?3400:1300; nf.Q.value=1.6;
    const ng=AC.createGain(); ng.gain.setValueAtTime(on?0.30:0.34,t);
    ng.gain.exponentialRampToValueAtTime(0.001,t+0.045);
    ns.connect(nf); nf.connect(ng); ng.connect(AC.destination);
    // corpo tonal curtíssimo (o "peso" da mola; mais grave no desligar)
    const o=AC.createOscillator(); o.type='triangle';
    o.frequency.setValueAtTime(on?1900:750,t);
    o.frequency.exponentialRampToValueAtTime(on?700:280,t+0.035);
    const og=AC.createGain(); og.gain.setValueAtTime(0.0001,t);
    og.gain.exponentialRampToValueAtTime(0.16,t+0.004);
    og.gain.exponentialRampToValueAtTime(0.0001,t+(on?0.04:0.06));
    o.connect(og); og.connect(AC.destination);
    ns.start(t); o.start(t); o.stop(t+0.09);
  }catch(e){}
}
function updateAudioMix(){
  if(!AC||!AN) return;
  const t=AC.currentTime;
  AN.master.gain.setTargetAtTime(STATE.som?0.9:0, t, 0.3);
  AN.wg.gain.setTargetAtTime(STATE.som&&STATE.vento?0.05:0, t, 0.5);
  AN.rg.gain.setTargetAtTime(STATE.som&&STATE.chuva?0.15:0, t, 0.5);
}

// ============================================================
// PAINEL (mobile: um botão por linha, colapsável)
// ============================================================
const $=id=>document.getElementById(id);
const NEV_LBL=['off','leve','densa'];
function refreshUI(){
  const on=luzesAcesas();
  const bl=$('b_luzes'); bl.title='luzes: '+(STATE.luzes==='auto'? `auto (${on?'acesas':'apagadas'})`:STATE.luzes);
  bl.className='tbtn'+(on?' on':(STATE.luzes==='auto'?' half':''));
  const bn=$('b_nevoa'); bn.title='névoa: '+NEV_LBL[STATE.nevoa]; bn.className='tbtn'+(STATE.nevoa?' on':'');
  const set=(id,flag,lbl,note)=>{ const b=$(id); b.title=lbl+': '+(flag?'on':'off')+(note||'');
    b.className='tbtn'+(flag?' on':''); };
  set('b_passaros',STATE.passaros,'pássaros', STATE.passaros&&isNoite(STATE.hora)?' (dormem)':'');
  set('b_fumaca',STATE.fumaca,'fumaça',' — chaminé/lareira: licença artística (a casa real não tem)');
  set('b_vagalumes',STATE.vagalumes,'vaga-lumes', STATE.vagalumes&&!isNoite(STATE.hora)?' (só à noite)':'');
  set('b_vento',STATE.vento,'vento');
  set('b_vida',STATE.vida,'vida interna', STATE.vida&&!on?' (luz off)':'');
  set('b_chuva',STATE.chuva,'chuva');
  set('b_neve',STATE.neve,'neve');
  const bs=$('b_som'); bs.title=AC? ('som: '+(STATE.som?'on':'off')):'som: toque pra ativar';
  bs.className='tbtn'+(STATE.som?' on':'');
  const bb=$('b_bloom'); const eff=bloomEff();
  bb.title='bloom: '+(bloomOn?(eff?'on':'on (dorme de dia)'):'off');
  bb.className='tbtn'+(eff?' on':(bloomOn?' half':''));
  const el=$('bloomStat'); if(el) el.textContent=eff?`on (s ${BLOOM.strength} · r ${BLOOM.radius} · t ${BLOOM.threshold}${IS_SOFT?' · sw':''})`:'off';
}
// se o loop está pausado (headless), aplica alvos na hora e re-renderiza
function syncNow(){
  window.__stage='pre-first-render';
applyHour(); refreshUI();
  if(paused){
    scene.fog.near=fogTgt.near; scene.fog.far=fogTgt.far; scene.fog.color.copy(fogColTgt);
    M.snow.opacity=STATE.neve?0.96:0; snowLayers.visible=M.snow.opacity>0.01;
    render();
  }
}
$('menuBtn').onclick=()=>$('panel').classList.toggle('hidden');
$('hora').addEventListener('input',e=>{ STATE.hora=parseFloat(e.target.value); syncNow(); });
$('b_luzes').onclick=()=>{ STATE.luzes=STATE.luzes==='auto'?'on':(STATE.luzes==='on'?'off':'auto'); syncNow(); };
$('b_nevoa').onclick=()=>{ STATE.nevoa=(STATE.nevoa+1)%3; syncNow(); };
$('b_passaros').onclick=()=>{ STATE.passaros=!STATE.passaros; syncNow(); };
$('b_fumaca').onclick=()=>{ STATE.fumaca=!STATE.fumaca; syncNow(); };
$('b_vagalumes').onclick=()=>{ STATE.vagalumes=!STATE.vagalumes; syncNow(); };
$('b_vento').onclick=()=>{ STATE.vento=!STATE.vento; syncNow(); };
function armVida(){ zones.forEach((z,i)=>{ z.next=tAcc+3+i*6+Math.random()*6; }); }
$('b_vida').onclick=()=>{ STATE.vida=!STATE.vida;
  if(STATE.vida) armVida(); else for(const z of zones) z.lit=true; syncNow(); };
$('b_chuva').onclick=()=>{ STATE.chuva=!STATE.chuva; if(STATE.chuva) STATE.neve=false;
  rain.pts.visible=STATE.chuva; snowPts.pts.visible=STATE.neve; syncNow(); };
$('b_neve').onclick=()=>{ STATE.neve=!STATE.neve; if(STATE.neve) STATE.chuva=false;
  rain.pts.visible=STATE.chuva; snowPts.pts.visible=STATE.neve; syncNow(); };
$('b_som').onclick=()=>{ if(!AC){ if(!ensureAudio()){ $('b_som').title='som: indisponível'; return; } STATE.som=true; }
  else STATE.som=!STATE.som; updateAudioMix(); refreshUI(); };
$('b_bloom').onclick=()=>window.__setBloom(!bloomOn);
// zoom vertical (polegar): 0=perto 1=longe, sincroniza com pinca
const zoomEl=document.getElementById('zoom');
function distToZoom(d){ return (d-controls.minDistance)/(controls.maxDistance-controls.minDistance); }
function applyZoom(v){ const d=controls.minDistance+(controls.maxDistance-controls.minDistance)*v;
  const dir=camera.position.clone().sub(controls.target).normalize();
  camera.position.copy(controls.target).addScaledVector(dir,d); }
zoomEl.addEventListener('input',()=>applyZoom(parseFloat(zoomEl.value)));
controls.addEventListener('change',()=>{ const v=distToZoom(camera.position.distanceTo(controls.target));
  if(Math.abs(v-parseFloat(zoomEl.value))>0.01) zoomEl.value=v.toFixed(3); });
zoomEl.value=distToZoom(camera.position.distanceTo(controls.target)).toFixed(3);
$('b_giro').onclick=()=>{ controls.autoRotate=!controls.autoRotate;
  $('b_giro').title=controls.autoRotate?'pausar giro':'girar'; };

// ============================================================
// v9 — TAP = toggle luz individual (raycast nos hit-proxies)
// pointerdown registra; pointerup com <6px e <300ms = tap (arrasto segue no OrbitControls)
// ============================================================
const _ray=new THREE.Raycaster(), _ndc=new THREE.Vector2();
let _pd=null;
renderer.domElement.addEventListener('pointerdown',e=>{ _pd={x:e.clientX,y:e.clientY,t:performance.now()}; });
function tapAt(cx,cy){
  _ndc.set(cx/innerWidth*2-1, -(cy/innerHeight)*2+1);
  _ray.setFromCamera(_ndc,camera);
  // oclusão: casa/telhado/varanda entram no teste. v9.1: com proxies inflados (60% + esferas
  // gordas), medir contra a borda do proxy vazaria — então a régua é a ÂNCORA REAL da luz:
  // um sólido só bloqueia se estiver >0.6m NA FRENTE da luz de verdade. Caixilho/travessa da
  // própria janela (cm à frente) não bloqueia; parede de outra fachada (metros) bloqueia.
  const hits=_ray.intersectObjects(hitTargets.concat([groups.casa,groups.telhado,groups.varanda]),true);
  if(!hits.length) return {hit:null, idx:null, d:null};
  const prox=hits.find(h=>h.object.userData.idx!==undefined);
  if(prox){
    const aD=camera.position.distanceTo(prox.object.userData.anchor);
    const solid=hits.find(h=>h.object.userData.idx===undefined);
    if(!solid || solid.distance > aD-0.6){
      toggleLight(prox.object.userData.idx);
      return {hit:prox.object.name, idx:prox.object.userData.idx, d:+prox.distance.toFixed(2)};
    }
  }
  return {hit:hits[0].object.name, idx:null, d:+hits[0].distance.toFixed(2)};
}
window.__tapAt=tapAt;
renderer.domElement.addEventListener('pointerup',e=>{
  if(!_pd) return;
  const moved=Math.hypot(e.clientX-_pd.x,e.clientY-_pd.y), dt=performance.now()-_pd.t; _pd=null;
  if(moved>=6||dt>=300) return;
  if(!luzesAcesas()) return;                    // disjuntor geral off/dia: clique ignorado
  window.__lastTap=tapAt(e.clientX,e.clientY);
});
function toggleLight(i){
  const l=LIGHTS[i]; if(!l) return null;
  l.on=!l.on;
  switchSound(l.on);                            // v9.1: "tec" de interruptor (feedback de UI)
  l.mat.color.setRGB(3.2,3.0,2.2);              // flash de feedback (150ms)
  if(paused) render();
  setTimeout(()=>{ applyLights(); if(paused) render(); },150);
  return l.on;
}
window.__toggleLight=toggleLight;
window.__lights=LIGHTS; window.__hitTargets=hitTargets;

// setters expostos (testes headless dirigem por aqui)
window.__setHora=h=>{ STATE.hora=clamp(h,0,24); $('hora').value=STATE.hora; syncNow(); return STATE.hora; };
window.__setLuzes=m=>{ STATE.luzes=(m===true?'on':(m===false?'off':m)); syncNow(); };
window.__setNevoa=n=>{ STATE.nevoa=clamp(n|0,0,2); syncNow(); };
window.__setPassaros=b=>{ STATE.passaros=!!b; syncNow(); };
window.__setFumaca=b=>{ STATE.fumaca=!!b; syncNow(); };
window.__setVagalumes=b=>{ STATE.vagalumes=!!b; syncNow(); };
window.__setVento=b=>{ STATE.vento=!!b; syncNow(); };
window.__setVida=b=>{ STATE.vida=!!b; if(b) armVida(); else for(const z of zones) z.lit=true; syncNow(); };
window.__setChuva=b=>{ STATE.chuva=!!b; if(b) STATE.neve=false;
  rain.pts.visible=STATE.chuva; snowPts.pts.visible=STATE.neve; syncNow(); };
window.__setNeve=b=>{ STATE.neve=!!b; if(b) STATE.chuva=false;
  rain.pts.visible=STATE.chuva; snowPts.pts.visible=STATE.neve; syncNow(); };
window.__setSom=b=>{ if(b&&!AC) ensureAudio(); STATE.som=!!b; updateAudioMix(); refreshUI(); };
window.__state=STATE;

const hint=document.getElementById('hint');
let hid=false; function hideHint(){ if(!hid){hid=true; hint.style.opacity='0';} }
renderer.domElement.addEventListener('pointerdown',hideHint,{once:true});
setTimeout(hideHint,5000);

const vRep=window.__sculptValidate();
document.getElementById('stat').innerHTML=
  `<b>Casa Craftsman v11 · definitiva</b> (edição fiel v10 + som/toque/balizas v9.1)<br>`+
  `clicáveis: <b>${LIGHTS.length}</b> (${clickGlass.length} janelas · ${clickFix.filter(f=>!f.small).length} luminárias · ${clickFix.filter(f=>f.small&&!f.up).length} balizas · ${clickFix.filter(f=>f.up).length} espetos)<br>`+
  `chaminé/lareira: <b>opcional</b> — licença artística (a casa real não tem)<br>`+
  `bloom: <b id="bloomStat">…</b><br>`+
  `antes do merge: ${metrics.before.calls} draw calls · ${metrics.before.tris.toLocaleString('pt-BR')} tris<br>`+
  `depois: <b>${metrics.after.calls} draw calls</b> (tudo ligado) · ${metrics.after.tris.toLocaleString('pt-BR')} tris<br>`+
  `validação runtime: ${vRep.ok?'<b>ok</b>':'<span style="color:#ff8a8a">erros</span>'} · `+
  `${vRep.issues.length} issue(s) · ${vRep.counts.meshes} meshes (${vRep.counts.instanced} inst)`;

let paused=false;
window.__pauseLoop=()=>{ paused=true; controls.autoRotate=false; };
window.__resumeLoop=()=>{ paused=false; clock.getDelta(); loop(); };
window.__renderOnce=()=>{ render(); };
window.__setView=function(name){
  controls.autoRotate=false;
  if(name==='photo'){ camera.position.set(6.2,2.4,22.2); controls.target.set(-0.2,3.0,0.4); }
  else if(name==='photo-v1'){ camera.position.set(4.8,2.4,16.6); controls.target.set(-0.2,2.95,0.4); }
  else if(name==='three-quarter'){ camera.position.set(15.0,8.2,16.0); controls.target.set(0,2.8,0); }
  else if(name==='front'){ camera.position.set(0,3.6,21.8); controls.target.set(0,3.4,0); }
  else if(name==='top'){ camera.position.set(0.01,33,2.5); controls.target.set(0,0,2.0); }
  controls.update(); render();
};
window.__controls=controls; window.__camera=camera; window.__scene=scene;
window.__renderer=renderer; window.__root=root;

// ============================================================
// LOOP — anima só o que está ligado
// ============================================================
const clock=new THREE.Clock();
let tAcc=rand(0,100), windAmp=0;
function tick(dt){
  tAcc+=dt;
  smoke.mat.uniforms.uTime.value=tAcc;
  fireflies.mat.uniforms.uTime.value=tAcc;
  rain.mat.uniforms.uTime.value=tAcc;
  snowPts.mat.uniforms.uTime.value=tAcc;
  if(birds.mesh.visible) birds.update(tAcc);
  // vento (fade da amplitude pra não dar tranco)
  windAmp+=((STATE.vento?1:0)-windAmp)*Math.min(1,dt*1.4);
  if(windAmp>0.003){
    arvG.rotation.z=Math.sin(tAcc*0.9)*0.010*windAmp;
    arvG.rotation.x=Math.sin(tAcc*0.7+1.3)*0.006*windAmp;
    shrubsM.rotation.z=Math.sin(tAcc*1.6+0.5)*0.008*windAmp;
    shrubsM.rotation.x=Math.sin(tAcc*1.2+2.1)*0.005*windAmp;
    tuftsM.rotation.z=Math.sin(tAcc*2.2)*0.014*windAmp;
  } else { arvG.rotation.set(0,0,0); shrubsM.rotation.set(0,0,0); tuftsM.rotation.set(0,0,0); }
  // névoa desliza pro alvo
  const fg=scene.fog, k=Math.min(1,dt*1.3);
  fg.near+=(fogTgt.near-fg.near)*k; fg.far+=(fogTgt.far-fg.far)*k; fg.color.lerp(fogColTgt,Math.min(1,dt*1.6));
  // camadas de neve com fade
  const st=STATE.neve?0.96:0;
  M.snow.opacity+=(st-M.snow.opacity)*Math.min(1,dt*0.9);
  snowLayers.visible=M.snow.opacity>0.01;
  // vida interna: zonas piscam a cada 8-25s — v9: respeita janela apagada no clique (AND em applyLights)
  if(STATE.vida && luzesAcesas()){
    let ch=false;
    for(const z of zones) if(tAcc>z.next){ z.lit=!z.lit; z.next=tAcc+8+Math.random()*17; ch=true; }
    if(ch) applyLights();
  }
  // lareira: fumaca ligada => porta do patio tremula em tom de fogo + luz alaranjada derrama
  // v9: se o usuário apagou a porta, o fogo AINDA tremula nela, em intensidade baixa (é o fogo, não a lâmpada)
  if(STATE.fumaca){
    const f=0.72+0.28*(0.6*Math.sin(tAcc*9.3)+0.4*Math.sin(tAcc*23.7+1.7));
    _fire.setRGB(2.0*f+0.45, 0.95*f+0.22, 0.22*f+0.06);
    const litHere=luzesAcesas()&&fireWin.on&&zones[fireWin.zone].lit;
    if(!litHere) _fire.multiplyScalar(0.45);
    fireWin.mat.color.lerp(_fire, litHere?0.30:0.85);
    fireLight.intensity=(litHere?2.0:4.2)*f; fireLight.visible=true;
  } else fireLight.visible=false;
}

applyHour(); refreshUI();
scene.fog.near=fogTgt.near; scene.fog.far=fogTgt.far; scene.fog.color.copy(fogColTgt);
render();
requestAnimationFrame(()=>{ document.getElementById('load').style.display='none'; });
function loop(){ if(paused) return; requestAnimationFrame(loop);
  tick(Math.min(clock.getDelta(),0.1)); controls.update(); render(); }
loop();
window.__ready=true;
</script>
