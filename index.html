<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0b0d" />
    <meta name="description" content="GP:OBRA — central de comando para gestão de obras: cronograma, financeiro, diário, materiais, planta técnica e chat em tempo real." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,900;1,900&display=swap" rel="stylesheet" />
    <title>GP:OBRA — Central de Obras</title>
    <style>
      #boot {
        position: fixed;
        inset: 0;
        background: #0a0b0d;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        z-index: 99999;
        transition: opacity 0.4s ease;
      }
      #boot .logo {
        font-family: 'Montserrat', system-ui, sans-serif;
        font-weight: 900;
        font-style: italic;
        font-size: 34px;
        color: #fff;
        letter-spacing: -1px;
      }
      #boot .logo span { color: #ffb7c5; }
      #boot .bar { width: 140px; height: 3px; background: rgba(255, 255, 255, 0.08); border-radius: 99px; overflow: hidden; }
      #boot .bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        background: #ffb7c5;
        border-radius: 99px;
        animation: slide 1s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="logo">GP<span>:OBRA</span></div>
      <div class="bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
